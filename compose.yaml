name: relay-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: qloo
      POSTGRES_PASSWORD: qloo_local_dev
      POSTGRES_DB: relay
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qloo -d relay"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  relay-postgres:
