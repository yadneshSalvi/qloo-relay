name: Verify RELAY

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: qloo
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qloo -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://qloo:local_ci_only@127.0.0.1:5432/relay_test
      RELAY_TEST_DATABASE_URL: postgresql://qloo:local_ci_only@127.0.0.1:5432/relay_test
      APP_ORIGIN: http://127.0.0.1:3101
      NEXT_TELEMETRY_DISABLED: "1"
      RELAY_LIVE_DISCOVERY_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test
      - run: pnpm exec tsx scripts/evaluate.ts
      - run: pnpm exec tsx scripts/migrate.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify production browser flows without provider credentials
        shell: bash
        run: |
          pnpm start > /tmp/relay-ci-server.log 2>&1 &
          relay_server_pid=$!
          trap 'kill "$relay_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/api/health > /dev/null
          pnpm test:e2e
