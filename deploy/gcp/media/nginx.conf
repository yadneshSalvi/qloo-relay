worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /srv;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; media-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location = /health { default_type text/plain; return 200 'ready\n'; }
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /RELAY-demo.mp4 {
      default_type video/mp4;
      types { }
      max_ranges 1;
      expires 1h;
      try_files $uri =404;
    }
    location = /captions.vtt {
      default_type text/vtt;
      types { }
      charset utf-8;
      try_files $uri =404;
    }
    location = /poster {
      default_type image/jpeg;
      types { }
      try_files $uri =404;
    }
    location / { return 404; }
  }
}
